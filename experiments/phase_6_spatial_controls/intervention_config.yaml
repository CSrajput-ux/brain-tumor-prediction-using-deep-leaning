# Phase 6 — Targeted Spatial Control Configuration
phase: 6
study_name: "targeted_spatial_control_validation"
random_seed: 42
bootstrap_replicates: 2000

dataset:
  input_resolution: [512, 512]
  model_input_resolution: [224, 224]
  interpolation: "bilinear"
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  total_samples: 3064
  total_patients: 233
  classes:
    - meningioma
    - glioma
    - pituitary

spatial_controls:
  experiment_a_luminance_preserved:
    patch_size: 16
    grid_resolution: [32, 32]
    protected_dilation_radius: 15
    seed: 42
  experiment_b_boundary_inpaint:
    margin_radius: 15
    algorithm: "Navier-Stokes"
    inpaint_radius: 3
    flags: "INPAINT_NS"
    structuring_element: "ellipse"
  experiment_c_margin_sweep:
    radii_pixels: [5, 10, 15, 20]
    structuring_elements:
      r05: [11, 11]
      r10: [21, 21]
      r15: [31, 31]
      r20: [41, 41]

conditions:
  C0_I_orig:
    description: "Unmanipulated original MRI slice"
    type: "reference"
  C1_I_tumor_removed:
    description: "Tumor core zeroed out"
    type: "lesion_ablation"
  C2_I_placebo_focal:
    description: "Contralateral matched focal region zeroed out"
    type: "focal_control"
  C5_I_distant_perturbed:
    description: "Remote cranial context dimmed by 50%; tumor and margin intact"
    type: "targeted_remote_context"
  C5LP_I_distant_luminance_preserved:
    description: "Remote cranial context patch-scrambled (16x16); tumor and margin intact; 100% luminance/variance preserved"
    type: "experiment_a_luminance_control"
  C3_r15_I_margin_removed:
    description: "Perilesional margin ring (15px dilation minus tumor) zeroed out; tumor intact"
    type: "targeted_spatial_margin"
  C3NS_I_margin_ns_inpaint:
    description: "Perilesional margin ring (15px) filled with Navier-Stokes PDE inpainting; tumor and distant tissue 100% intact"
    type: "experiment_b_boundary_control"
  C4_r15_I_margin_placebo:
    description: "Contralateral margin ring (15px dilation minus placebo) zeroed out; tumor intact"
    type: "targeted_spatial_margin_control"
  C3_r05_I_margin_removed:
    description: "Perilesional margin ring (5px dilation minus tumor) zeroed out; tumor intact"
    type: "margin_thickness_sweep"
  C4_r05_I_margin_placebo:
    description: "Contralateral margin ring (5px dilation minus placebo) zeroed out; tumor intact"
    type: "margin_thickness_sweep_control"
  C3_r10_I_margin_removed:
    description: "Perilesional margin ring (10px dilation minus tumor) zeroed out; tumor intact"
    type: "margin_thickness_sweep"
  C4_r10_I_margin_placebo:
    description: "Contralateral margin ring (10px dilation minus placebo) zeroed out; tumor intact"
    type: "margin_thickness_sweep_control"
  C3_r20_I_margin_removed:
    description: "Perilesional margin ring (20px dilation minus tumor) zeroed out; tumor intact"
    type: "margin_thickness_sweep"
  C4_r20_I_margin_placebo:
    description: "Contralateral margin ring (20px dilation minus placebo) zeroed out; tumor intact"
    type: "margin_thickness_sweep_control"

scenarios:
  S0:
    name: "Random Patient Split"
    manifest: "prepared_full_run/patient_splits.csv"
    cluster_column: "patient_id"
    clusters: 233
  S1:
    name: "Regrouped Leakage-Free (SSIM 0.80)"
    manifest: "experiments/phase_1_7/candidate_grouped_manifests/split_regrouped_ssim_0_80.csv"
    cluster_column: "combined_group_id"
    clusters: 231
  S2:
    name: "Aggressively Regrouped (SSIM 0.75)"
    manifest: "experiments/phase_1_7/candidate_grouped_manifests/split_regrouped_ssim_0_75.csv"
    cluster_column: "combined_group_id"
    clusters: 217

models:
  architecture: "ResNet-50"
  weights: "frozen_phase_2_checkpoints"
  checkpoint_dir: "experiments/phase_2_baseline"
