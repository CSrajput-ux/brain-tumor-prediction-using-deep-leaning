# Phase 5 — Targeted Context Reliance and Spatial Intervention Configuration
phase: 5
study_name: "targeted_context_reliance_and_spatial_interventions"
random_seed: 42
bootstrap_replicates: 2000

dataset:
  input_resolution: [512, 512]
  model_input_resolution: [224, 224]
  interpolation: "bilinear"
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  total_samples: 3064
  total_patients: 233
  classes:
    - meningioma
    - glioma
    - pituitary

spatial_interventions:
  dilation_radius_pixels: 15
  structuring_element: "ellipse"
  structuring_element_size: [31, 31]
  distant_context_scaling: 0.50
  feathering_sigma: 2.0
  parenchymal_threshold: 20

conditions:
  C0_I_orig:
    description: "Unmanipulated original MRI slice"
    type: "reference"
  C1_I_tumor_removed:
    description: "Tumor core zeroed out"
    type: "lesion_ablation"
  C2_I_placebo_focal:
    description: "Contralateral matched focal region zeroed out"
    type: "focal_control"
  C3_I_margin_removed:
    description: "Perilesional margin ring (15px dilation minus tumor) zeroed out; tumor intact"
    type: "targeted_spatial_margin"
  C4_I_margin_placebo:
    description: "Contralateral margin ring (15px dilation minus placebo) zeroed out; tumor intact"
    type: "targeted_spatial_margin_control"
  C5_I_distant_perturbed:
    description: "Remote cranial context dimmed by 50%; tumor and margin intact"
    type: "targeted_remote_context"
  C6_I_margin_feathered:
    description: "Perilesional margin ring ablated with Gaussian feathering and mean parenchymal infill"
    type: "boundary_sensitivity"

scenarios:
  S0:
    name: "Random Patient Split"
    manifest: "prepared_full_run/patient_splits.csv"
    cluster_column: "patient_id"
    clusters: 233
  S1:
    name: "Regrouped Leakage-Free (SSIM 0.80)"
    manifest: "experiments/phase_1_7/candidate_grouped_manifests/split_regrouped_ssim_0_80.csv"
    cluster_column: "combined_group_id"
    clusters: 231
  S2:
    name: "Aggressively Regrouped (SSIM 0.75)"
    manifest: "experiments/phase_1_7/candidate_grouped_manifests/split_regrouped_ssim_0_75.csv"
    cluster_column: "combined_group_id"
    clusters: 217

models:
  architecture: "ResNet-50"
  weights: "frozen_phase_2_checkpoints"
  checkpoint_dir: "experiments/phase_2_baseline"
